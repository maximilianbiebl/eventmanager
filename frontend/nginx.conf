server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /anleitung/teamleiter ohne Schraegstrich leitet nginx auf die Fassung
    # mit Schraegstrich um. Absolut gebaut stuende darin der Port im
    # Container (3000) - hinter einem anderen Port oder Proxy ginge das ins
    # Leere. Relativ bleibt der Browser, wo er ist.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
